[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mauripay-analytics-backend"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "pydantic>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.2",
]

[project.scripts]
mauripay = "mauripay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests"]
