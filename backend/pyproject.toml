[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mauripay-analytics-backend"
version = "0.2.0"
description = "Backend Python pour l'analyse de transactions Mobile Money MauriPay."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MauriPay Analytics Team" },
]
license = "MIT"
keywords = ["mobile-money", "fraud-detection", "analytics", "mauritania"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "pyarrow>=14.0",
    "scikit-learn>=1.2",
    "torch>=2.0",
]

[project.scripts]
mauripay = "mauripay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests"]
