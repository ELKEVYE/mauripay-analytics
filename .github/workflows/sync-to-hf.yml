name: Deploy Backend to HF Spaces

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'README.md'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install git-lfs
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Push backend only to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p /tmp/hf-deploy
          cp -r backend/src /tmp/hf-deploy/src
          cp backend/pyproject.toml /tmp/hf-deploy/
          cp -r backend/models /tmp/hf-deploy/models
          cp Dockerfile /tmp/hf-deploy/
          cp README.md /tmp/hf-deploy/
          cp backend/README.md /tmp/hf-deploy/backend-README.md 2>/dev/null || true

          cd /tmp/hf-deploy
          git init
          git lfs install
          git lfs track "*.joblib"
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .gitattributes
          git add .
          git commit -m "deploy backend"
          git push https://seydnaaly:$HF_TOKEN@huggingface.co/spaces/seydnaaly/mauripay-backend HEAD:main --force
